name: CI

# Builds sweph.dll from the bundled Swiss Ephemeris source, runs the tests (the
# calculation and data layer; they need no WinUI), then builds the app itself so
# that a broken view or binding is caught too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build sweph.dll
        shell: pwsh
        run: .\Build-SwephDll.ps1

      - name: Test
        run: dotnet test tests\Lore.Tests

      - name: Build the app
        run: dotnet build Lore.csproj -c Release

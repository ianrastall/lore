name: CI

# Builds sweph.dll from the bundled Swiss Ephemeris source and runs the tests
# (the calculation and data layer; they need no WinUI).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build sweph.dll
        shell: pwsh
        run: .\Build-SwephDll.ps1

      - name: Test
        run: dotnet test tests\Lore.Tests
